      <script>
        const bgMusic = document.getElementById("bg-music");
        const soundToggle = document.getElementById("sound-toggle");

        soundToggle.addEventListener("click", (e) => {
          e.preventDefault();
          bgMusic.muted = !bgMusic.muted;
          soundToggle.innerHTML = bgMusic.muted
            ? '<i class="fa-solid fa-volume-xmark"></i>'
            : '<i class="fa-solid fa-volume-high"></i>';
        });
      </script>

      <script>
        const socialBar = document.querySelector(".social-bar");
        const socialGlider = document.querySelector(".social-glider");
        const socialLinks = document.querySelectorAll(".social-bar a");

        function gliderToFull() {
          const barRect = socialBar.getBoundingClientRect();
          const first = socialLinks[0].getBoundingClientRect();
          const last =
            socialLinks[socialLinks.length - 1].getBoundingClientRect();
          const padding = 20; // breathing room around the whole icon group
          const left = first.left - barRect.left - padding;
          const width = last.right - first.left + padding * 2;
          socialGlider.style.left = left + "px";
          socialGlider.style.width = width + "px";
        }

        function gliderToLink(el) {
          const barRect = socialBar.getBoundingClientRect();
          const rect = el.getBoundingClientRect();
          const padding = 14; // breathing room around a single hovered icon
          socialGlider.style.left = rect.left - barRect.left - padding + "px";
          socialGlider.style.width = rect.width + padding * 2 + "px";
        }

        window.addEventListener("load", gliderToFull);
        window.addEventListener("resize", gliderToFull);

        socialLinks.forEach((link) => {
          link.addEventListener("mouseenter", () => {
            gliderToLink(link);
            socialGlider.classList.add("hovering");
          });
          link.addEventListener("mouseleave", () => {
            gliderToFull();
            socialGlider.classList.remove("hovering");
          });
        });
      </script>

      <script>
        const nav = document.querySelector("nav");
        const glider = document.querySelector(".nav-glider");
        const links = document.querySelectorAll(".nav-link");

        function moveGliderTo(el) {
          const navRect = nav.getBoundingClientRect();
          const rect = el.getBoundingClientRect();
          glider.style.left = rect.left - navRect.left + "px";
          glider.style.width = rect.width + "px";
        }

        const activeLink =
          document.querySelector(".nav-link.active") || links[0];

        window.addEventListener("load", () => moveGliderTo(activeLink));
        window.addEventListener("resize", () =>
          moveGliderTo(document.querySelector(".nav-link.active") || links[0]),
        );

        links.forEach((link) => {
          link.addEventListener("mouseenter", () => {
            moveGliderTo(link);
            glider.classList.add("hover-pop");
          });
          link.addEventListener("mouseleave", () => {
            glider.classList.remove("hover-pop");
            moveGliderTo(
              document.querySelector(".nav-link.active") || links[0],
            );
          });
        });
      </script>
    </div>
